<div class="container">
  <div *ngIf="loading" class="loading">Cargando Pokémon...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <div class="grid">
    <app-pokemon-card
      *ngFor="let pokemon of pokemonList$ | async; trackBy: trackById"
      [pokemon]="pokemon"
      (selected)="onSelectPokemon($event)"
    ></app-pokemon-card>
  </div>

  <app-pokemon-detail
    *ngIf="selectedPokemon"
    [pokemon]="selectedPokemon"
    (closed)="onCloseDetail()"
  ></app-pokemon-detail>
</div>
