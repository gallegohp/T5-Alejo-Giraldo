<div class="container">
  @if (loading) {
    <div class="loading">Cargando Pokémon...</div>
  }
  
  @if (error) {
    <div class="error">{{ error }}</div>
  }
  
  <div class="grid">
    @for (pokemon of pokemonList$ | async; track pokemon.id) {
      <app-pokemon-card 
        [pokemon]="pokemon"
        (selected)="onSelectPokemon($event)">
      </app-pokemon-card>
    }
  </div>
  
  @if (selectedPokemon) {
    <app-pokemon-detail 
      [pokemon]="selectedPokemon"
      (closed)="onCloseDetail()">
    </app-pokemon-detail>
  }
</div>
