<div class="card" (click)="onClick()">
  <img [src]="pokemon.sprites.front_default" [alt]="pokemon.name">
  <h3>{{ pokemon.name }}</h3>
  <p><strong>ID:</strong> #{{ pokemon.id }}</p>
  <div class="types">
    <span *ngFor="let type of pokemon.types" class="type">{{ type.type.name }}</span>
  </div>
</div>
