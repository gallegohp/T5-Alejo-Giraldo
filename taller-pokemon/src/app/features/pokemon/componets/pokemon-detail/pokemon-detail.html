<div class="detail">
  <button class="close" (click)="onClose()">×</button>
  <img [src]="pokemon.sprites.front_default" [alt]="pokemon.name">
  <h2>{{ pokemon.name }}</h2>
  <p class="id">#{{ pokemon.id }}</p>
  
  <div class="section">
    <h3>Types</h3>
    <div class="types">
      <span *ngFor="let type of pokemon.types" class="type">{{ type.type.name }}</span>
    </div>
  </div>
  
  <div class="section">
    <h3>Stats</h3>
    <div *ngFor="let stat of pokemon.stats" class="stat">
      <span>{{ stat.stat.name }}</span>
      <span>{{ stat.base_stat }}</span>
    </div>
  </div>
  
  <div class="section">
    <h3>Abilities</h3>
    <span *ngFor="let ability of pokemon.abilities" class="ability">{{ ability.ability.name }}</span>
  </div>
</div>
